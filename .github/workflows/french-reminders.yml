name: French Class Reminders

on:
  schedule:
    # Runs at UTC times covering 7:10-10:10 AM and 7:10-10:10 PM CST/CDT
    # Python script checks actual CST/CDT time before sending

    # Morning window (covers both CDT=UTC-5 and CST=UTC-6)
    - cron: '10 12 * * *'   # 7:10 AM CDT
    - cron: '10 13 * * *'   # 8:10 AM CDT  /  7:10 AM CST
    - cron: '10 14 * * *'   # 9:10 AM CDT  /  8:10 AM CST
    - cron: '10 15 * * *'   # 10:10 AM CDT /  9:10 AM CST
    - cron: '10 16 * * *'   # 10:10 AM CST

    # Evening window (covers both CDT=UTC-5 and CST=UTC-6)
    - cron: '10 0 * * *'    # 7:10 PM CDT
    - cron: '10 1 * * *'    # 8:10 PM CDT  /  7:10 PM CST
    - cron: '10 2 * * *'    # 9:10 PM CDT  /  8:10 PM CST
    - cron: '10 3 * * *'    # 10:10 PM CDT /  9:10 PM CST
    - cron: '10 4 * * *'    # 10:10 PM CST

  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Send reminder if class is coming up
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd french-reminders
          python send_reminder.py
